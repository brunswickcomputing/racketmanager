name: Build and Release Racketmanager WordPress Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mysqli

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Determine Version and Archive Name
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION=$(grep -i "Version:" racketmanager.php | head -n 1 | sed -E "s/.*Version:[[:space:]]*([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/")
            if [ -z "$VERSION" ]; then
              VERSION="${{ github.ref_name }}"
            fi
          fi
          ZIP_NAME="racketmanager-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Build Plugin Archive
        run: |
          # Create a clean packaging directory with the exact plugin slug
          mkdir -p build_dir/racketmanager

          # Copy plugin files, excluding git/dev artifacts
          rsync -rc --exclude='.git*' \
                    --exclude='.github' \
                    --exclude='tests' \
                    --exclude='my-tests' \
                    --exclude='build_dir' \
                    --exclude='sonar-project.properties' \
                    --exclude='*.log' \
                    ./ build_dir/racketmanager/

          # Package into a zip archive with the root folder 'racketmanager/'
          cd build_dir
          zip -r "../${ZIP_NAME}" racketmanager/
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: racketmanager-${{ steps.vars.outputs.VERSION }}
          path: build_dir/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
