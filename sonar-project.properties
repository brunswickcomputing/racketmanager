sonar.organization=brunswickcomputing
sonar.projectKey=brunswickcomputing_racketmanager

# relative paths to source directories. More details and properties are described
# at https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-scope/
sonar.sources=src/php
sonar.tests=tests

# PHPUnit test execution and code coverage report paths
sonar.php.tests.reportPath=build/logs/junit.xml
sonar.php.coverage.reportPaths=build/logs/clover.xml

# Exclude rule S6819 (false positive on layout tables with role="presentation", fixed upstream in SONARHTML-443)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.e1.resourceKey=templates/email/**