name: Build and Release Racketmanger WordPress Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: '8.4'
          extensions: intl, mysqli
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Determine Version and Archive Name
        id: vars
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" =~ ^refs/tags/ ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION=$(grep -i "Version:" racketmanager.php | head -n 1 | sed -E "s/.*Version:[[:space:]]*([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/")
            if [ -z "$VERSION" ]; then
              VERSION="$REF_NAME"
            fi
          fi
          ZIP_NAME="racketmanager-${VERSION}.zip"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Build Plugin Archive
        run: |
          # Create a clean packaging directory with the exact plugin slug
          mkdir -p build_dir/racketmanager

          # Copy plugin files, excluding git/dev artifacts
          rsync -rc --exclude='.git*' \
                    --exclude='.github' \
                    --exclude='tests' \
                    --exclude='my-tests' \
                    --exclude='build_dir' \
                    --exclude='sonar-project.properties' \
                    --exclude='*.log' \
                    ./ build_dir/racketmanager/

          # Package into a zip archive with the root folder 'racketmanager/'
          cd build_dir
          zip -r "../${ZIP_NAME}" racketmanager/
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: racketmanager-${{ steps.vars.outputs.VERSION }}
          path: build_dir/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.0.8
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}