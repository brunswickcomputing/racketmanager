# This workflow triggers a SonarCloud analysis of the codebase.
# Note: In SonarCloud project settings (Administration > Analysis Method),
# "Automatic Analysis" must be disabled for CI-based GitHub Actions analysis.

name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results
  contents: read

jobs:
  Analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # Job-level env is required so the scan step `if` can see the secret.
    # Fork PRs receive empty secrets, so the scan is skipped and the job stays green.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # actions/checkout@v6.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for SonarCloud analysis

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1  # shivammathur/setup-php@2.36.0
        with:
          php-version: '8.4'
          tools: composer
          coverage: pcov
          extensions: intl

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit with Coverage & JUnit Report
        run: |
          mkdir -p build/logs
          vendor/bin/phpunit --display-all-issues --fail-on-all-issues --log-junit build/logs/junit.xml --coverage-clover build/logs/clover.xml

      - name: Analyze with SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # SonarSource/sonarqube-scan-action@v8.3.0
        with:
          projectBaseDir: .
